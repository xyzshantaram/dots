# keyd config, carried over verbatim from the Fedora install.
#
# CapsLock AND the physical Super key both act as Meta, and both open the
# application drawer when tapped. niri cannot bind a bare modifier — it has no
# way to fire on the release of Super without another key (niri-wm/niri#4142,
# #4651) — so the tap is resolved here instead, using overload(): held, the key
# is Meta; tapped, it emits F13. niri binds F13 to the same command as Mod+D.
# F13 is otherwise unused, and f23 is taken by the Copilot key below.
#
# The tap action does not fire when another key is pressed during the hold, so
# Mod+T and friends are unaffected. That is what makes this form usable at all;
# keyd's Example 7 in keyd.scdoc relies on the same property.
#
# If a slow, deliberate hold-then-release ever opens the drawer by accident,
# raise overload_tap_timeout below. measure-taps.py was written to pick that
# value from real presses.
#
# The Copilot key on this ThinkPad emits leftmeta + leftshift + f23 at the
# evdev level, and leftmeta is now overloaded above. That chord presses an
# intervening key (f23) before leftmeta is released, so it resolves as a hold
# and no F13 is emitted. Unverified on hardware: if dictation stops working,
# this overload is the first thing to suspect.
#
# A composite [meta+shift] layer lets `f23` be rebound while keyd ignores the
# modifiers of the constituent layers, so no Meta or Shift leaks into the
# output. The result is a plain Pause press, which 110-niri.ts binds to
# `voxtype record toggle`.
#
# NOTE: emit a *plain* key here, never a modifier chord like macro(C-M-d).
# C-M-d emits Meta while the physical Meta is held as a layer modifier, which
# corrupts keyd's modifier bookkeeping and leaves Shift stuck down.
#
# Install: sudo cp default.conf /etc/keyd/default.conf && sudo keyd reload

[ids]
*

# How long a hold may last and still count as a tap. A press held longer than
# this is treated purely as a modifier, and the tap action is ignored.
#
# 200ms sits above a deliberate tap (measured with tools/measure-taps.py) with
# a little headroom, and far below the holds used for Mod+X. The trade-off is
# one-sided: raising it makes a stray drawer more likely, lowering it makes a
# slow tap silently do nothing. If drawer opens feel unreliable, raise it; if
# one fires while you are just resting on the key, lower it.
[global]
overload_tap_timeout = 200

[main]
capslock = overload(meta, f13)
leftmeta = overload(meta, f13)

[alt]
capslock = capslock

# Composite layer (must be defined after [main]/[alt]).
[meta+shift]
f23 = pause
